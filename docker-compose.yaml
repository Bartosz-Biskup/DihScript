services:
  app:
    container_name: ta_backend
    restart: unless-stopped
    build: .
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      # Override the host-facing URL from .env with the in-network MySQL hostname.
      - DATABASE_URL=mysql+pymysql://root:${DATABASE_PASSWORD}@database:3306/${DATABASE_NAME}
    depends_on:
      database:
        condition: service_healthy
        restart: true
  database:
    container_name: ta_database
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
    ports:
      # Exposed on a non-default port so local MySQL installs don't clash.
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - db_volume:/var/lib/mysql

volumes:
  db_volume:
